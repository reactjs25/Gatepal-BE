name: Deploy Node App to EC2

on:
  push:
    branches:
      - aws

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: 13.61.14.14
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /gatepal/Gatepal-BE
            git pull origin main
            npm install
            pm2 restart 0 || pm2 start server.js --name=nodeapp
